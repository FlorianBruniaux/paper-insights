[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-insights"
version = "0.1.0"
description = "Local research paper corpus for evidence-backed search, monitoring, analysis, and citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.scripts]
paper-insights = "paper_insights.bootstrap:main"
paper-insights-search-relevance = "paper_insights.benchmarks.search_relevance:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-socket>=0.7,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["paper_insights"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/hooks/**" = ["S101", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["paper_insights"]
